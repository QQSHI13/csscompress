[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csscompress"
version = "0.1.0"
description = "Fast and safe CSS minifier — community fork of csscompressor with the data-URI whitespace fix"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
authors = [{ name = "QQSHI13" }]
keywords = ["css", "minify", "compressor", "yui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]

[tool.setuptools]
packages = ["csscompress"]
