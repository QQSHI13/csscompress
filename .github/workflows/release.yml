name: Release

# Trigger: push a tag (v0.1.0, v1.0.0, ...) — CI tests must pass first.
# Publishing uses trusted publishing (OIDC) — no API token. Configure it once
# on PyPI: project csscompress -> Publishing -> Add pending publisher
#   owner: QQSHI13, repository: csscompress, workflow: release.yml

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: pip install .
      - name: Run tests
        run: python -m unittest discover -s csscompress/tests

  release:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/csscompress
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
